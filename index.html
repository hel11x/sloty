<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Spin Casino</title>
  <style>
    :root {
      --bg-1: #090d17;
      --bg-2: #101827;
      --panel: rgba(14, 20, 31, 0.9);
      --panel-2: rgba(18, 36, 54, 0.9);
      --gold: #f7d870;
      --gold-2: #f4b942;
      --gold-3: #d49a1d;
      --green: #2dd4bf;
      --red: #ff5b72;
      --white: #eef6ff;
      --muted: #a9b8cf;
      --shadow: rgba(0, 0, 0, 0.45);
      --glass: rgba(255, 255, 255, 0.06);
      --line: rgba(255,255,255,0.1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(247, 216, 112, 0.14), transparent 20%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 45%, #0b1220);
      color: var(--white);
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(1100px, 96vw);
      background: linear-gradient(180deg, rgba(13,20,31,0.9), rgba(9,15,23,0.96));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px;
      box-shadow: 0 28px 80px rgba(0,0,0,0.55);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(247,216,112,0.09), transparent 30%);
      pointer-events: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 8px 18px;
      position: relative;
      z-index: 1;
    }

    .title {
      font-size: clamp(2rem, 3vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--gold);
      text-shadow: 0 0 26px rgba(247,216,112,0.22);
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      background: linear-gradient(135deg, rgba(247,216,112,0.18), rgba(244,185,66,0.12));
      border: 1px solid rgba(247,216,112,0.5);
      color: #fef3c7;
      font-weight: 800;
      border-radius: 999px;
      padding: 10px 16px;
      box-shadow: 0 12px 18px rgba(247,216,112,0.06);
    }

    .machine {
      background: linear-gradient(180deg, rgba(16, 25, 39, 0.98), rgba(10, 15, 24, 0.96));
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 26px;
      box-shadow: inset 0 0 26px rgba(255,255,255,0.04);
      padding: 18px;
      position: relative;
      z-index: 1;
    }

    .display {
      background: linear-gradient(180deg, rgba(9,55,46,0.8), rgba(6,25,20,0.86));
      border-radius: 22px;
      border: 6px solid #d3a630;
      box-shadow:
        inset 0 0 26px rgba(0,0,0,0.22),
        0 18px 30px rgba(0,0,0,0.22);
      padding: 18px 18px 12px;
      overflow: hidden;
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(5, minmax(110px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .reel {
      background: linear-gradient(180deg, #f4f7fd, #e0e8ff);
      border-radius: 18px;
      height: 175px;
      border: 4px solid rgba(17,24,39,0.8);
      box-shadow:
        inset 0 0 22px rgba(255,255,255,0.82),
        0 14px 20px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .reel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(0,0,0,0.04));
      pointer-events: none;
    }

    .reel.active {
      animation: pulse 0.18s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(0.985);
        box-shadow: inset 0 0 18px rgba(255,255,255,0.82), 0 10px 16px rgba(0,0,0,0.18);
      }
      to {
        transform: scale(1.02);
        box-shadow: inset 0 0 22px rgba(255,255,255,0.9), 0 12px 18px rgba(247,216,112,0.24);
      }
    }

    .symbol {
      position: relative;
      z-index: 1;
      font-size: clamp(2.5rem, 4vw, 4rem);
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(255,255,255,0.6);
      user-select: none;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }

    .label {
      display: block;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.72rem;
      margin-bottom: 6px;
    }

    .value {
      font-size: clamp(1.25rem, 2vw, 1.8rem);
      font-weight: 900;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 0.8px;
      transition: transform 0.15s ease, filter 0.14s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px); }

    .bet-btn {
      background: rgba(255,255,255,0.06);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 12px 18px;
      min-width: 90px;
    }

    .spin-btn {
      padding: 16px 32px;
      min-width: 180px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #1a1a1a;
      font-size: 1.08rem;
      box-shadow: 0 14px 26px rgba(247,216,112,0.2);
    }

    .max-btn {
      background: linear-gradient(135deg, rgba(45,212,191,0.2), rgba(56,189,248,0.18));
      color: var(--white);
      border: 1px solid rgba(45,212,191,0.45);
    }

    .message {
      margin-top: 18px;
      min-height: 32px;
      text-align: center;
      font-weight: 900;
      font-size: 1.04rem;
      color: #fef3c7;
    }

    .message.win { color: #86efac; }
    .message.lose { color: #fca5a5; }

    @media (max-width: 760px) {
      .reels {
        grid-template-columns: repeat(5, minmax(70px, 1fr));
      }

      .reel {
        height: 135px;
      }

      .hud {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }

      .controls {
        flex-direction: column;
      }

      .spin-btn, .bet-btn, .max-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">ROYAL SPIN</div>
      <div class="stats">
        <div class="chip" id="creditText">Kredity: 1000</div>
        <div class="chip" id="jackpotText">Jackpot: 5000</div>
      </div>
    </div>

    <div class="machine">
      <div class="display">
        <div class="reels">
          <div class="reel"><div class="symbol" id="slot0">7</div></div>
          <div class="reel"><div class="symbol" id="slot1">7</div></div>
          <div class="reel"><div class="symbol" id="slot2">7</div></div>
          <div class="reel"><div class="symbol" id="slot3">7</div></div>
          <div class="reel"><div class="symbol" id="slot4">7</div></div>
        </div>

        <div class="hud">
          <div class="stat">
            <span class="label">Kredity</span>
            <span class="value" id="balance">1000</span>
          </div>
          <div class="stat">
            <span class="label">Sázka</span>
            <span class="value" id="bet">50</span>
          </div>
          <div class="stat">
            <span class="label">Poslední výhra</span>
            <span class="value" id="lastWin">0</span>
          </div>
          <div class="stat">
            <span class="label">Výherní řada</span>
            <span class="value" id="line">3x</span>
          </div>
        </div>

        <div class="controls">
          <button class="bet-btn" id="minusBet">- 10</button>
          <button class="bet-btn" id="plusBet">+ 10</button>
          <button class="bet-btn max-btn" id="maxBet">MAX</button>
          <button class="spin-btn" id="spinBtn">SPIN</button>
        </div>

        <div class="message" id="message">Vyzkoušej štěstí a roztoč jackpot!</div>
      </div>
    </div>
  </div>

  <script>
    const SYMBOLS = [
      { id: "seven", icon: "7", weight: 4, multiplier: 18, color: "#fbbf24" },
      { id: "cherry", icon: "🍒", weight: 15, multiplier: 6, color: "#fb7185" },
      { id: "bell", icon: "🔔", weight: 10, multiplier: 9, color: "#fef08a" },
      { id: "lemon", icon: "🍋", weight: 16, multiplier: 4, color: "#bef264" },
      { id: "diamond", icon: "💎", weight: 7, multiplier: 12, color: "#67e8f9" },
      { id: "star", icon: "⭐", weight: 5, multiplier: 15, color: "#f9a8d4" },
      { id: "coin", icon: "💰", weight: 8, multiplier: 10, color: "#facc15" },
      { id: "wild", icon: "✦", weight: 3, multiplier: 24, color: "#c084fc" }
    ];

    const state = {
      balance: 1000,
      bet: 50,
      jackpot: 5000,
      spinning: false
    };

    const slots = [
      document.getElementById("slot0"),
      document.getElementById("slot1"),
      document.getElementById("slot2"),
      document.getElementById("slot3"),
      document.getElementById("slot4")
    ];

    const reels = [...document.querySelectorAll(".reel")];

    function setMessage(text, type = "") {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = "message";
      if (type) el.classList.add(type);
    }

    function getSymbolById(id) {
      return SYMBOLS.find(symbol => symbol.id === id);
    }

    function getWeightedSymbol() {
      const pool = [];
      SYMBOLS.forEach(symbol => {
        for (let i = 0; i < symbol.weight; i++) pool.push(symbol.id);
      });
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function renderSymbols(result) {
      result.forEach((symbolId, index) => {
        const info = getSymbolById(symbolId);
        const el = slots[index];
        el.textContent = info ? info.icon : symbolId;
        el.style.color = info ? info.color : "#111827";
      });
    }

    function updateHud() {
      document.getElementById("balance").textContent = state.balance;
      document.getElementById("bet").textContent = state.bet;
      document.getElementById("lastWin").textContent = "0";
      document.getElementById("creditText").textContent = `Kredity: ${state.balance}`;
      document.getElementById("jackpotText").textContent = `Jackpot: ${state.jackpot}`;
    }

    function playTone(freq = 440, duration = 120, type = "triangle", volume = 0.02) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      setTimeout(() => {
        osc.stop();
        ctx.close();
      }, duration);
    }

    function payout(result, bet) {
      const set = result.slice(0, 5);

      const counts = {};
      set.forEach(id => {
        counts[id] = (counts[id] || 0) + 1;
      });

      const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
      if (!best) return 0;

      const [symbolId, count] = best;
      if (count >= 3) {
        const symbol = getSymbolById(symbolId);
        return bet * symbol.multiplier * (count >= 5 ? 1.8 : 1);
      }

      const matchPairs = set.filter((v, i, arr) => arr.indexOf(v) !== i).length;
      if (matchPairs > 0) return Math.floor(bet * 2);

      return 0;
    }

    function spinAnimation(finalResult) {
      let frame = 0;
      reels.forEach(reel => reel.classList.add("active"));

      const interval = setInterval(() => {
        const random = Array.from({ length: 5 }, () => getWeightedSymbol());
        renderSymbols(random);
        frame++;

        if (frame >= 16) {
          clearInterval(interval);
          renderSymbols(finalResult);
          reels.forEach(reel => reel.classList.remove("active"));
        }
      }, 75);
    }

    function spin() {
      if (state.spinning) return;

      if (state.bet > state.balance) {
        setMessage("Nemáš dostatek kreditů pro tuto sázku.", "lose");
        playTone(180, 180, "sawtooth", 0.02);
        return;
      }

      state.spinning = true;
      state.balance -= state.bet;
      updateHud();

      const result = Array.from({ length: 5 }, () => getWeightedSymbol());
      spinAnimation(result);

      document.getElementById("spinBtn").disabled = true;
      document.getElementById("spinBtn").style.opacity = "0.7";

      setTimeout(() => {
        const win = payout(result, state.bet);
        document.getElementById("lastWin").textContent = win;

        if (win > 0) {
          state.balance += win;
          state.jackpot += Math.max(25, Math.floor(state.bet / 5));
          setMessage(`Výhra: ${win} kreditů! 🎉`, "win");
          playTone(900, 180, "triangle", 0.04);
          setTimeout(() => playTone(1180, 180, "triangle", 0.04), 100);
          setTimeout(() => playTone(1500, 260, "triangle", 0.045), 220);
        } else {
          setMessage("Prohrál jsi tento spin. Zkus to znovu!", "lose");
          playTone(210, 200, "sawtooth", 0.03);
        }

        updateHud();
        state.spinning = false;
        document.getElementById("spinBtn").disabled = false;
        document.getElementById("spinBtn").style.opacity = "1";
      }, 1300);
    }

    function changeBet(value) {
      if (state.spinning) return;
      const next = state.bet + value;

      if (next >= 10 && next <= 500) {
        state.bet = next;
        document.getElementById("bet").textContent = state.bet;
      } else {
        setMessage("Sázka musí být mezi 10 a 500 kredity.", "lose");
      }
    }

    document.getElementById("spinBtn").addEventListener("click", spin);
    document.getElementById("plusBet").addEventListener("click", () => changeBet(10));
    document.getElementById("minusBet").addEventListener("click", () => changeBet(-10));
    document.getElementById("maxBet").addEventListener("click", () => {
      if (!state.spinning) {
        state.bet = 500;
        document.getElementById("bet").textContent = state.bet;
      }
    });

    updateHud();
    renderSymbols(["seven", "bell", "diamond", "cherry", "coin"]);
  </script>
</body>
</html>
