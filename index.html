<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casino Slots Deluxe</title>
  <style>
    :root {
      --bg-deep: #090d17;
      --bg-panel: #101827;
      --bg-table: #0e2d22;
      --gold: #f7c948;
      --gold-2: #ff9f1c;
      --green: #2dd4bf;
      --red: #fb7185;
      --text: #edf6ff;
      --muted: #a5b4c8;
      --shadow: rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(247, 201, 72, 0.18), transparent 20%),
        linear-gradient(135deg, var(--bg-deep), #111827 40%, #0a1020);
      color: var(--text);
      overflow-x: hidden;
    }

    .app {
      width: min(980px, 94vw);
      background: rgba(14, 20, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      box-shadow: 0 30px 80px var(--shadow);
      padding: 22px;
      backdrop-filter: blur(9px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title {
      font-size: clamp(2rem, 3.5vw, 3rem);
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--gold);
      text-shadow: 0 0 25px rgba(247, 201, 72, 0.3);
    }

    .bank {
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(247,201,72,0.22), rgba(255,159,28,0.12));
      border: 1px solid rgba(247,201,72,0.4);
      font-weight: 800;
      color: #fef3c7;
    }

    .machine {
      background: linear-gradient(180deg, rgba(22, 34, 52, 0.98), rgba(12, 17, 25, 0.96));
      border: 2px solid rgba(255,255,255,0.06);
      border-radius: 28px;
      padding: 18px 18px 12px;
      box-shadow: inset 0 0 25px rgba(255,255,255,0.04);
    }

    .display {
      background: linear-gradient(180deg, rgba(18,59,46,0.82), rgba(10,36,28,0.86));
      border: 6px solid #d4a933;
      border-radius: 24px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.25), 0 16px 30px rgba(0,0,0,0.2);
      padding: 18px 18px 12px;
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 18px;
      margin-bottom: 16px;
    }

    .reel {
      height: 190px;
      border-radius: 18px;
      background: linear-gradient(180deg, #f5f7fa, #dfe9ff);
      border: 4px solid rgba(20, 30, 42, 0.8);
      box-shadow: inset 0 0 25px rgba(255,255,255,0.8), 0 12px 18px rgba(0,0,0,0.22);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .reel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.25), rgba(0,0,0,0.05));
      pointer-events: none;
    }

    .reel.active {
      animation: pulse 0.18s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.98); box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 8px 12px rgba(0,0,0,0.18); }
      to   { transform: scale(1.02); box-shadow: inset 0 0 20px rgba(255,255,255,0.9), 0 12px 16px rgba(247,201,72,0.2); }
    }

    .symbol {
      position: relative;
      z-index: 1;
      font-size: clamp(2.4rem, 4vw, 4rem);
      font-weight: 900;
      letter-spacing: 1px;
      color: #111827;
      text-shadow: 0 2px 8px rgba(255,255,255,0.6);
      user-select: none;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }

    .label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .value {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      font-weight: 900;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 0.8px;
      transition: transform 0.15s ease, filter 0.1s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px); }

    .spin {
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #1b1b1b;
      padding: 16px 28px;
      min-width: 180px;
      font-size: 1.05rem;
      box-shadow: 0 12px 26px rgba(247,201,72,0.25);
    }

    .bet-btn {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 12px 18px;
      min-width: 90px;
    }

    .msg {
      text-align: center;
      min-height: 30px;
      margin-top: 18px;
      font-weight: 900;
      font-size: 1.04rem;
      color: #fef3c7;
    }

    .msg.win { color: #86efac; }
    .msg.lose { color: #fca5a5; }

    @media (max-width: 700px) {
      .reels {
        grid-template-columns: repeat(3, minmax(90px, 1fr));
      }
      .hud {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
      }
      .controls {
        flex-direction: column;
      }
      .spin, .bet-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">🎰 GOLDEN JACKPOT</div>
      <div class="bank" id="bankText">Bank: 1000 bodů</div>
    </div>

    <div class="machine">
      <div class="display">
        <div class="reels">
          <div class="reel"><div class="symbol" id="slot0">7</div></div>
          <div class="reel"><div class="symbol" id="slot1">7</div></div>
          <div class="reel"><div class="symbol" id="slot2">7</div></div>
        </div>

        <div class="hud">
          <div class="stat">
            <span class="label">Zůstatek</span>
            <span class="value" id="balance">1000</span>
          </div>

          <div class="stat">
            <span class="label">Sázka</span>
            <span class="value" id="bet">50</span>
          </div>

          <div class="stat">
            <span class="label">Poslední výhra</span>
            <span class="value" id="lastWin">0</span>
          </div>

          <div class="stat">
            <span class="label">Jackpot</span>
            <span class="value" id="jackpot">5000</span>
          </div>
        </div>

        <div class="controls">
          <button class="bet-btn" id="minusBet">- 10</button>
          <button class="bet-btn" id="plusBet">+ 10</button>
          <button class="bet-btn" id="maxBet">MAX</button>
          <button class="spin" id="spinBtn">SPIN</button>
        </div>

        <div class="msg" id="message">Vyzkoušej štěstí!</div>
      </div>
    </div>
  </div>

  <script>
    const SYMBOLS = [
      { name: "7", icon: "7", weight: 4, multiplier: 16, color: "#fbbf24" },
      { name: "BAR", icon: "BAR", weight: 7, multiplier: 10, color: "#e2e8f0" },
      { name: "CH", icon: "CH", weight: 12, multiplier: 5, color: "#fb7185" },
      { name: "BELL", icon: "BELL", weight: 9, multiplier: 8, color: "#fef08a" },
      { name: "LEM", icon: "LEM", weight: 15, multiplier: 4, color: "#bef264" },
      { name: "DIAM", icon: "DIAM", weight: 6, multiplier: 12, color: "#67e8f9" },
      { name: "STAR", icon: "★", weight: 3, multiplier: 20, color: "#f9a8d4" },
      { name: "WILD", icon: "WILD", weight: 2, multiplier: 30, color: "#c084fc" }
    ];

    const state = {
      balance: 1000,
      bet: 50,
      jackpot: 5000,
      spinning: false
    };

    const elements = {
      balance: document.getElementById("balance"),
      bet: document.getElementById("bet"),
      lastWin: document.getElementById("lastWin"),
      jackpot: document.getElementById("jackpot"),
      bank: document.getElementById("bankText"),
      message: document.getElementById("message"),
      slots: [
        document.getElementById("slot0"),
        document.getElementById("slot1"),
        document.getElementById("slot2")
      ],
      reels: [...document.querySelectorAll(".reel")],
      spinBtn: document.getElementById("spinBtn"),
      plusBet: document.getElementById("plusBet"),
      minusBet: document.getElementById("minusBet"),
      maxBet: document.getElementById("maxBet")
    };

    function getWeightedSymbol() {
      const pool = [];
      SYMBOLS.forEach(symbol => {
        for (let i = 0; i < symbol.weight; i++) pool.push(symbol.name);
      });
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function getSymbolInfo(symbolName) {
      return SYMBOLS.find(s => s.name === symbolName);
    }

    function renderSlots(reels) {
      reels.forEach((symbolName, index) => {
        const info = getSymbolInfo(symbolName);
        const el = elements.slots[index];
        el.textContent = info ? info.icon : symbolName;
        el.style.color = info ? info.color : "#111827";
      });
    }

    function updateHud() {
      elements.balance.textContent = state.balance;
      elements.bet.textContent = state.bet;
      elements.jackpot.textContent = state.jackpot;
      elements.bank.textContent = `Bank: ${state.balance} bodů`;
    }

    function setMessage(text, type = "") {
      elements.message.textContent = text;
      elements.message.className = "msg";
      if (type) elements.message.classList.add(type);
    }

    function playTone(freq, duration = 120, type = "triangle", volume = 0.025) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      setTimeout(() => {
        osc.stop();
        ctx.close();
      }, duration);
    }

    function payout(reels, bet) {
      const [a, b, c] = reels;

      if (a === b && b === c) {
        const info = getSymbolInfo(a);
        if (info) return bet * info.multiplier;
      }

      const matches = [a === b, b === c, a === c].filter(Boolean).length;
      if (matches >= 1) {
        return Math.floor(bet * 2);
      }

      return 0;
    }

    function spinAnimation(finalReels) {
      const frames = 16;
      let i = 0;

      elements.reels.forEach(reel => reel.classList.add("active"));

      const interval = setInterval(() => {
        const randomReels = [getWeightedSymbol(), getWeightedSymbol(), getWeightedSymbol()];
        renderSlots(randomReels);
        i++;

        if (i >= frames) {
          clearInterval(interval);
          renderSlots(finalReels);
          elements.reels.forEach(reel => reel.classList.remove("active"));
        }
      }, 90);
    }

    function spin() {
      if (state.spinning) return;

      if (state.bet > state.balance) {
        setMessage("Nemáš dostatek bodů na tuto sázku.", "lose");
        playTone(180, 200, "sawtooth", 0.02);
        return;
      }

      state.spinning = true;
      state.balance -= state.bet;
      updateHud();

      elements.spinBtn.disabled = true;
      elements.spinBtn.style.opacity = "0.7";

      const finalReels = [getWeightedSymbol(), getWeightedSymbol(), getWeightedSymbol()];
      spinAnimation(finalReels);

      setTimeout(() => {
        const win = payout(finalReels, state.bet);

        if (win > 0) {
          state.balance += win;
          state.jackpot += Math.max(20, Math.floor(state.bet / 4));
          elements.lastWin.textContent = win;
          setMessage(`Výhra: ${win} bodů! 🎉`, "win");
          playTone(880, 160, "triangle", 0.035);
          setTimeout(() => playTone(1100, 180, "triangle", 0.038), 100);
          setTimeout(() => playTone(1400, 220, "triangle", 0.04), 220);
        } else {
          elements.lastWin.textContent = "0";
          setMessage("Prohrál jsi. Zkus to znovu!", "lose");
          playTone(220, 200, "sawtooth", 0.03);
        }

        updateHud();
        state.spinning = false;
        elements.spinBtn.disabled = false;
        elements.spinBtn.style.opacity = "1";
      }, 1400);
    }

    function changeBet(step) {
      if (state.spinning) return;

      const nextBet = state.bet + step;
      if (nextBet >= 10 && nextBet <= 500) {
        state.bet = nextBet;
        updateHud();
      } else {
        setMessage("Sázka musí být mezi 10 a 500 body.", "lose");
      }
    }

    document.getElementById("spinBtn").addEventListener("click", spin);
    document.getElementById("plusBet").addEventListener("click", () => changeBet(10));
    document.getElementById("minusBet").addEventListener("click", () => changeBet(-10));
    document.getElementById("maxBet").addEventListener("click", () => {
      state.bet = 500;
      updateHud();
    });

    updateHud();
    renderSlots(["7", "7", "7"]);
  </script>
</body>
</html>
